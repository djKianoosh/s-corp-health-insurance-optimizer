<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-4%" y="-2%" width="108%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
    <filter id="banner-shadow" x="-2%" y="-4%" width="104%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
    <linearGradient id="header-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="winner-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="900" fill="#f8fafc" />

  <!-- Top App Navigation / Header -->
  <g transform="translate(0, 24)">
    <!-- App Icon Circle -->
    <circle cx="800" cy="24" r="22" fill="url(#header-grad)" filter="url(#card-shadow)" />
    <!-- Calculator Glyph -->
    <rect x="790" y="14" width="20" height="20" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="794" y1="18" x2="806" y2="18" stroke="#ffffff" stroke-width="2" />
    <circle cx="796" cy="24" r="1.5" fill="#ffffff" />
    <circle cx="804" cy="24" r="1.5" fill="#ffffff" />
    <circle cx="796" cy="29" r="1.5" fill="#ffffff" />
    <circle cx="804" cy="29" r="1.5" fill="#ffffff" />

    <!-- Badges -->
    <g transform="translate(680, 56)">
      <rect x="0" y="0" width="130" height="22" rx="11" fill="#dbeafe" />
      <text x="65" y="15" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">2027 Open Enrollment</text>

      <text x="145" y="15" fill="#64748b" font-size="12" font-weight="500">· Tax Year 2027 Guidelines</text>
    </g>

    <!-- Main Title -->
    <text x="800" y="105" fill="#0f172a" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="-0.5">S-Corp Health Insurance Optimizer</text>
    <text x="800" y="128" fill="#475569" font-size="14" font-weight="400" text-anchor="middle">
      Compare the <tspan fill="#2563eb" font-weight="600">SEHI Deduction</tspan> vs. <tspan fill="#7c3aed" font-weight="600">ACA Subsidy Optimization</tspan> under 2027 rules with 400% FPL cliff policy modeling.
    </text>
  </g>

  <!-- ================= LEFT COLUMN: FINANCIAL INPUTS ================= -->
  <g transform="translate(60, 175)">
    <!-- Container Card -->
    <rect width="660" height="695" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)" />

    <!-- Card Header -->
    <line x1="24" y1="20" x2="24" y2="44" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
    <text x="36" y="38" fill="#1e293b" font-size="18" font-weight="700">Financial Inputs</text>
    <text x="636" y="38" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">2027 Standards</text>
    <line x1="24" y1="56" x2="636" y2="56" stroke="#f1f5f9" stroke-width="1" />

    <!-- Owner Pay Card -->
    <rect x="24" y="68" width="612" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="44" y="94" fill="#2563eb" font-size="14" font-weight="700">S-Corp Owner Pay (2027)</text>
    
    <!-- Owner Grid -->
    <text x="44" y="120" fill="#64748b" font-size="11">Gross Salary: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$85,000</tspan></text>
    <text x="210" y="120" fill="#64748b" font-size="11">Fed W/H: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$9,200</tspan></text>
    <text x="350" y="120" fill="#64748b" font-size="11">FICA/Med: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$6,503</tspan></text>
    <text x="490" y="120" fill="#64748b" font-size="11">State W/H: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$4,500</tspan></text>

    <line x1="44" y1="134" x2="616" y2="134" stroke="#e2e8f0" stroke-width="1" />
    <text x="44" y="156" fill="#64748b" font-size="11">401(k) Pre-tax: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$6,000</tspan></text>
    <text x="260" y="156" fill="#64748b" font-size="11">HSA (Form 8889): <tspan font-weight="700" fill="#0f172a" font-family="monospace">$3,500</tspan></text>
    <text x="480" y="156" fill="#16a34a" font-size="12" font-weight="700">Net: <tspan font-family="monospace">$54,797</tspan></text>

    <!-- Spouse Pay Card -->
    <rect x="24" y="188" width="612" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="44" y="214" fill="#475569" font-size="14" font-weight="700">Spouse Pay (2027)</text>
    <text x="44" y="240" fill="#64748b" font-size="11">Gross Salary: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$48,000</tspan></text>
    <text x="210" y="240" fill="#64748b" font-size="11">Fed W/H: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$3,500</tspan></text>
    <text x="350" y="240" fill="#64748b" font-size="11">FICA/Med: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$3,672</tspan></text>
    <text x="490" y="240" fill="#64748b" font-size="11">State W/H: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$2,200</tspan></text>

    <line x1="44" y1="254" x2="616" y2="254" stroke="#e2e8f0" stroke-width="1" />
    <text x="44" y="276" fill="#64748b" font-size="11">401(k) Pre-tax: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$3,000</tspan></text>
    <text x="260" y="276" fill="#64748b" font-size="11">HSA (Sec 125): <tspan font-weight="700" fill="#0f172a" font-family="monospace">$1,500</tspan></text>
    <text x="480" y="276" fill="#16a34a" font-size="12" font-weight="700">Net: <tspan font-family="monospace">$34,128</tspan></text>

    <!-- Health Plan Details Sub-Card -->
    <rect x="24" y="310" width="612" height="175" rx="8" fill="#eef2ff" stroke="#e0e7ff" stroke-width="1" />
    <text x="44" y="334" fill="#312e81" font-size="13" font-weight="700">2027 Health Plan Details</text>
    
    <!-- Presets -->
    <rect x="44" y="348" width="280" height="34" rx="6" fill="#ffffff" stroke="#c7d2fe" />
    <text x="56" y="364" fill="#1e1b4b" font-size="11" font-weight="700">Individual HDHP</text>
    <text x="56" y="376" fill="#64748b" font-size="9" font-family="monospace">$1,750 ded · $8,700 max</text>

    <rect x="336" y="348" width="280" height="34" rx="6" fill="#4338ca" />
    <text x="348" y="364" fill="#ffffff" font-size="11" font-weight="700">Family HDHP (Selected)</text>
    <text x="348" y="376" fill="#c7d2fe" font-size="9" font-family="monospace">$3,500 ded · $17,400 max</text>

    <text x="44" y="415" fill="#475569" font-size="12">Annual Premium: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$16,500</tspan></text>
    <text x="250" y="415" fill="#475569" font-size="12">Plan Deductible: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$3,500</tspan></text>
    <text x="440" y="415" fill="#475569" font-size="12">OOP Maximum: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$17,400</tspan></text>
    <text x="44" y="450" fill="#475569" font-size="12">Coinsurance: <tspan font-weight="700" fill="#0f172a" font-family="monospace">20%</tspan></text>
    <text x="250" y="450" fill="#475569" font-size="12">Marginal Tax Bracket: <tspan font-weight="700" fill="#0f172a" font-family="monospace">24%</tspan></text>

    <!-- 2027 ACA Optimization Sub-Card -->
    <rect x="24" y="495" width="612" height="185" rx="8" fill="#faf5ff" stroke="#f3e8ff" stroke-width="1" />
    <text x="44" y="520" fill="#581c87" font-size="13" font-weight="700">2027 ACA Optimization Inputs</text>

    <!-- Policy Toggle Box -->
    <rect x="44" y="534" width="572" height="52" rx="6" fill="#ffffff" stroke="#e9d5ff" />
    <text x="56" y="552" fill="#581c87" font-size="11" font-weight="700">2027 Subsidy Policy Rule:</text>
    
    <rect x="210" y="542" width="180" height="34" rx="4" fill="#6b21a8" />
    <text x="300" y="563" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Strict 400% Cliff</text>

    <rect x="400" y="542" width="200" height="34" rx="4" fill="#f3e8ff" />
    <text x="500" y="563" fill="#6b21a8" font-size="11" font-weight="500" text-anchor="middle">Extended Subsidies (IRA)</text>

    <text x="44" y="612" fill="#64748b" font-size="12">Household Size: <tspan font-weight="700" fill="#0f172a" font-family="monospace">3</tspan> (2027 FPL Benchmark: $27,320 · 400% Cliff: $109,280)</text>
    <text x="44" y="635" fill="#64748b" font-size="12">Capital Losses Harvested: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$0</tspan> (Max $3,000 statutory limit)</text>
    <text x="44" y="658" fill="#64748b" font-size="12">Est. ACA Subsidy: <tspan font-weight="700" fill="#0f172a" font-family="monospace">$8,400</tspan> (Clawed back to $0 if &gt; 400% FPL)</text>
  </g>

  <!-- ================= RIGHT COLUMN: ANALYSIS & RESULTS ================= -->
  <g transform="translate(750, 175)">
    <!-- Top Row: Scenario 1 & 2 Cards -->
    
    <!-- Scenario 1 (S-Corp) Card - Winner -->
    <rect x="0" y="0" width="385" height="195" rx="12" fill="url(#winner-grad)" stroke="#3b82f6" stroke-width="2" filter="url(#card-shadow)" />
    <text x="24" y="34" fill="#1e293b" font-size="16" font-weight="800">Scenario 1: S-Corp Path</text>
    <text x="24" y="52" fill="#64748b" font-size="11">1040 Schedule 1 SEHI Deduction</text>

    <rect x="295" y="18" width="68" height="24" rx="12" fill="#2563eb" />
    <text x="329" y="34" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">WINNER</text>

    <line x1="24" y1="68" x2="360" y2="68" stroke="#dbeafe" stroke-width="1" />
    <text x="24" y="92" fill="#475569" font-size="13">Unsubsidized Premium:</text>
    <text x="360" y="92" fill="#0f172a" font-size="13" font-family="monospace" font-weight="600" text-anchor="end">$16,500</text>

    <text x="24" y="116" fill="#16a34a" font-size="13" font-weight="600">SEHI Tax Savings (24%):</text>
    <text x="360" y="116" fill="#16a34a" font-size="13" font-family="monospace" font-weight="700" text-anchor="end">- $3,960</text>

    <line x1="24" y1="134" x2="360" y2="134" stroke="#cbd5e1" stroke-width="1" />
    <text x="24" y="165" fill="#1e293b" font-size="14" font-weight="700">Net Premium Cost:</text>
    <text x="360" y="168" fill="#1e293b" font-size="24" font-family="monospace" font-weight="800" text-anchor="end">$12,540</text>

    <!-- Scenario 2 (ACA) Card - Cliff Hit -->
    <rect x="405" y="0" width="385" height="195" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#card-shadow)" />
    
    <!-- Red Cliff Tag -->
    <path d="M 725,0 L 790,0 L 790,65 Z" fill="#ef4444" />
    <text x="765" y="26" fill="#ffffff" font-size="9" font-weight="800" transform="rotate(45 765 26)" text-anchor="middle">CLIFF</text>

    <text x="429" y="34" fill="#1e293b" font-size="16" font-weight="800">Scenario 2: ACA Path</text>
    <text x="429" y="52" fill="#64748b" font-size="11">Form 8962 Premium Tax Credit</text>

    <line x1="429" y1="68" x2="765" y2="68" stroke="#f1f5f9" stroke-width="1" />
    <text x="429" y="92" fill="#475569" font-size="13">Unsubsidized Premium:</text>
    <text x="765" y="92" fill="#0f172a" font-size="13" font-family="monospace" font-weight="600" text-anchor="end">$16,500</text>

    <text x="429" y="116" fill="#dc2626" font-size="12" font-weight="600">ACA Subsidy (412.5% FPL):</text>
    <text x="765" y="116" fill="#dc2626" font-size="13" font-family="monospace" font-weight="700" text-anchor="end">$0 allowed</text>

    <line x1="429" y1="134" x2="765" y2="134" stroke="#e2e8f0" stroke-width="1" />
    <text x="429" y="165" fill="#1e293b" font-size="14" font-weight="700">Net Premium Cost:</text>
    <text x="765" y="168" fill="#1e293b" font-size="24" font-family="monospace" font-weight="800" text-anchor="end">$16,500</text>

    <!-- Recommendation Banner -->
    <rect x="0" y="212" width="790" height="54" rx="10" fill="#0f172a" filter="url(#banner-shadow)" />
    <circle cx="32" cy="239" r="14" fill="#10b981" fill-opacity="0.2" />
    <text x="32" y="244" fill="#34d399" font-size="16" font-weight="900" text-anchor="middle">$</text>
    <text x="58" y="236" fill="#ffffff" font-size="14" font-weight="700">Scenario 1 (S-Corp Path) is the better option for 2027</text>
    <text x="58" y="254" fill="#94a3b8" font-size="12">
      Estimated annual premium savings: <tspan fill="#34d399" font-weight="700" font-family="monospace">$3,960</tspan> (due to 400% FPL cliff expiration)
    </text>

    <!-- Comparison Chart Card -->
    <rect x="0" y="280" width="790" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)" />
    <text x="24" y="308" fill="#1e293b" font-size="15" font-weight="700">2027 Net Premium Cost Comparison</text>

    <!-- Chart Grid -->
    <line x1="80" y1="330" x2="750" y2="330" stroke="#f1f5f9" stroke-width="1" />
    <line x1="80" y1="380" x2="750" y2="380" stroke="#f1f5f9" stroke-width="1" />
    <line x1="80" y1="430" x2="750" y2="430" stroke="#cbd5e1" stroke-width="1" />

    <!-- Scenario 1 Bar (Green + Grey stacked) -->
    <rect x="200" y="355" width="90" height="75" rx="4" fill="#22c55e" />
    <rect x="200" y="331" width="90" height="24" rx="4" fill="#94a3b8" />
    <text x="245" y="448" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">Scenario 1 (S-Corp)</text>
    <text x="245" y="398" fill="#ffffff" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle">$12,540</text>

    <!-- Scenario 2 Bar (Purple full) -->
    <rect x="490" y="331" width="90" height="99" rx="4" fill="#a855f7" />
    <text x="535" y="448" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">Scenario 2 (ACA)</text>
    <text x="535" y="385" fill="#ffffff" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle">$16,500</text>

    <!-- Total Healthcare Liability Table Card -->
    <rect x="0" y="485" width="790" height="210" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)" />
    <text x="24" y="514" fill="#1e293b" font-size="15" font-weight="700">Total Estimated Healthcare Liability (Premium + OOP Medical)</text>
    
    <!-- Table Header -->
    <rect x="20" y="528" width="750" height="28" fill="#f8fafc" />
    <text x="32" y="546" fill="#64748b" font-size="11" font-weight="700">MEDICAL USAGE SCENARIO</text>
    <text x="500" y="546" fill="#2563eb" font-size="11" font-weight="700" text-anchor="end">SCENARIO 1 (S-CORP)</text>
    <text x="750" y="546" fill="#7c3aed" font-size="11" font-weight="700" text-anchor="end">SCENARIO 2 (ACA)</text>

    <!-- Row 1: Low -->
    <text x="32" y="582" fill="#0f172a" font-size="13" font-weight="600">Low Usage ($1k billed)</text>
    <text x="32" y="596" fill="#64748b" font-size="10">Routine preventative visits</text>
    <text x="500" y="586" fill="#1e3a8a" font-size="13" font-family="monospace" font-weight="700" text-anchor="end">$13,540 ($1k OOP)</text>
    <text x="750" y="586" fill="#581c87" font-size="13" font-family="monospace" font-weight="700" text-anchor="end">$17,540 ($1k OOP)</text>
    <line x1="20" y1="608" x2="770" y2="608" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 2: Medium -->
    <text x="32" y="628" fill="#0f172a" font-size="13" font-weight="600">Medium Usage ($10k billed)</text>
    <text x="32" y="642" fill="#64748b" font-size="10">Specialist care / Minor surgery</text>
    <text x="500" y="632" fill="#1e3a8a" font-size="13" font-family="monospace" font-weight="700" text-anchor="end">$16,040 ($3.5k OOP)</text>
    <text x="750" y="632" fill="#581c87" font-size="13" font-family="monospace" font-weight="700" text-anchor="end">$20,040 ($3.5k OOP)</text>
    <line x1="20" y1="654" x2="770" y2="654" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 3: High -->
    <text x="32" y="674" fill="#0f172a" font-size="13" font-weight="600">High Usage ($75k billed)</text>
    <text x="32" y="688" fill="#64748b" font-size="10">Major hospitalization / Hits 2027 OOP Max ($17,400)</text>
    <text x="500" y="678" fill="#1e3a8a" font-size="13" font-family="monospace" font-weight="700" text-anchor="end">$29,940 ($17.4k OOP)</text>
    <text x="750" y="678" fill="#581c87" font-size="13" font-family="monospace" font-weight="700" text-anchor="end">$33,940 ($17.4k OOP)</text>
  </g>
</svg>
